name: inventory-check

on:
  pull_request:
    paths:
      - "docs/migration/**"
      - "app/**"
      - "scripts/check_inventory.py"
      - ".github/workflows/inventory-check.yml"
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/check_inventory.py
