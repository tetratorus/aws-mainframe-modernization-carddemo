spring:
  application:
    name: carddemo-java
  datasource:
    url: ${CARDDEMO_DB_URL:jdbc:postgresql://localhost:5432/carddemo}
    username: ${CARDDEMO_DB_USER:carddemo}
    password: ${CARDDEMO_DB_PASSWORD:carddemo}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

carddemo:
  # Directory holding the legacy ASCII sample files (app/data/ASCII). Loaded only when tables are empty.
  legacy-data-dir: ${CARDDEMO_LEGACY_DATA_DIR:../../app/data/ASCII}
  seed-users: true

server:
  port: ${PORT:8080}
